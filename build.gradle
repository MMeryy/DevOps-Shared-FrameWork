plugins {
    id 'java'
    id 'application'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

application {
    mainClass = 'com.demo.App'
}

tasks.named('test') {
    useJUnitPlatform()
}